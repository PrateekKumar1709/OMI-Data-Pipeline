# SPDX-License-Identifier: Apache-2.0
name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Start Frontend Service
        run: docker-compose up -d odr-frontend

      - name: Wait for Frontend to be Ready
        run: |
          for i in {1..30}; do
            nc -z localhost 5173 && echo "Frontend up!" && exit 0
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend did not start in time" && exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5173'  # Frontend service URL
          rules_file_name: '.zap/rules.tsv'  # Custom rules file
          cmd_options: '-a'  # Run in automated mode
          fail_action: WARN  # Don't fail the build on warnings

      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: zap-results/
          retention-days: 30

      - name: Stop Application
        if: always()
        run: docker-compose down 