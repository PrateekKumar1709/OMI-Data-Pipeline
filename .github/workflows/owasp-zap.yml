# SPDX-License-Identifier: Apache-2.0
name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.5

      - name: Start Frontend Service
        run: |
          cd modules/odr_frontend
          pnpm install
          pnpm run dev &
          # Wait for the service to be ready
          sleep 30

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5173'  # Frontend service URL
          rules_file_name: '.zap/rules.tsv'  # Custom rules file
          cmd_options: '-a'  # Run in automated mode
          fail_action: WARN  # Don't fail the build on warnings
          scan_level: MEDIUM  # Set scan level to MEDIUM
          threshold: MEDIUM  # Only fail on MEDIUM or higher issues

      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: zap-results/
          retention-days: 30

      - name: Stop Frontend Service
        if: always()
        run: pkill -f "pnpm run dev" 